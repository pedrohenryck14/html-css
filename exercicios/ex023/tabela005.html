<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>exercicio de tabelas</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    table {
      width: 500px;
      border-collapse: collapse;
      
    }

    caption{
      font-size: 1.5em;
      font-weight: bolder;
      padding: 8px;
    }

    td, th {
      border: 1px solid black;
      padding: 8px;
    }

   col.cnome, col.cprof {
    background-color: blue;
   }

   col.csexo{
    background-color: brown;
   }

  
  </style>
</head>
<body>
  <table>
  <colgroup>
    <col class="cnome">
    <col class="csexo" span="2">
    <col class="cprof" >
  </colgroup>
    <caption>cadrasto</caption>
    <tr>
      <th scope="col">nome</th>
      <th scope="col">sexo</th>
      <th scope="col">idade</th>
      <th scope="col">profissao</th>
    </tr>
    <tr>
      <td>Ana maria</td>
      <td>F</td>
      <td>25</td>
      <td>jornalista</td>
    </tr>
    <tr>
      <td>Otavio</td>
      <td>M</td>
      <td>25</td>
      <td>jornalista</td>
    </tr>
    <tr>
      <td>Claudia</td>
      <td>F</td>
      <td>25</td>
      <td>jornalista</td>
    </tr>
    <tr>
      <td>Gustavo</td>
      <td>M</td>
      <td>25</td>
      <td>jornalista</td>
    </tr>
    <tr>
      <td>Helio</td>
      <td>M</td>
      <td>25</td>
      <td>jornalista</td>
    </tr>
    <tr>
      <td>Maria</td>
      <td>F</td>
      <td>25</td>
      <td>jornalista</td>
    </tr>
  </table>
</body>
</html>
