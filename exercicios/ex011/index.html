<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midias em HTML5</title>
</head>
<body>
  <h1>imagem dinamica</h1>
  <p>tente abrir esse site em varios dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador.</p>

  <picture>
    <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
    <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
    <img src="imagens/foto-g.png" alt="imagem flexivel">
  </picture>
  
  <h1>reproduzindo audio</h1>
  <p>vamos aprender a reproduzir audios em HTML5.</p>
  <audio src="midia/toccata-Bach.mp3" controls loop></audio>
  <audio src="midia/guanacast-33.mp3" controls loop></audio>
</body>
</html>
