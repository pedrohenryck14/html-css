<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos com html5</title>
</head>
<body>
  <h1>Criando videos hospedados localmente</h1> <p>Este video esta hospedado no meu proprio servidor</p>

  <video width="560" controls loop>
    <source src="midia/Meu-Video.webm.webm" type="video/webm">
    <source src="midia/meu-video.mp4.mp4" type="video/mp4">
    <source src="midia/meu-video.ogv.ogv" type="video/ogg">
    <source src="midia/meu-video.m4v.mp4" type="video/mp4">
    <p>seu navegador nao tem compatibilidade com reproduçao de videos.</p>
  </video>
  
   <h1>inserindo videos do youtube</h1>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/jPWsBuiy1rE?si=DlmKaS4bUrvx_mLw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</body>
</html>
