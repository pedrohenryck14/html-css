<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabala do desafio</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    table {
      border-collapse: collapse;
      width: 500px;
     
    }

    th, td {
      padding: 10px;
      border: 1px solid black;
       text-align: center;
    }
    
    thead {
      background-color: grey;
      color: white;
    }

    .media {
      background-color: grey;
      color: white;
      text-align: left;
    }
  </style>
</head>
<body>

  <table>
    <thead>
     <tr>
      <th rowspan="2" scope="col">Area</th>
      <th rowspan="2" scope="col">Disciplina</th>
      <th colspan="2" scope="colgroup">notas</th>
      <th rowspan="2" scope="col">Medias</th>
     </tr>
     <tr>
      <th scope="col">nota 1</th>
      <th scope="col">nota 2</th>
     </tr>
    </thead>

    <tbody>
    <tr>
      <th rowspan="4" scope="rowgroup">exatas</th>
      <td>matematica</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>
    <tr>
      <td>fisica</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>
    <tr>
      <td>quimica</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>     
    </tr>
    <tr>
      <td>historia</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>      
    </tr>

    <tr class="media">
      <th colspan="4" scope="row">media de exatas</th>
      <td>0000</td>
    </tr>

    <tr>
      <th rowspan="2" scope="rowgroup">humanas</th>
      <td>hisoria</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>
    <tr>
      <td>geografia</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>

    </tr>
    <tr class="media">
      <th colspan="4" scope="row">media de humanas</th>
      <td>0000</td>
     </tr>
    </tbody>
  </table>
</body>
</html>
